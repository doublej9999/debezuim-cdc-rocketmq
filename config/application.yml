server:
  port: 8082

spring:
  application:
    name: debezium-cdc-rocketmq
  datasource:
    # Docker 容器访问宿主机 PostgreSQL（Windows/Mac）请使用 host.docker.internal
    url: jdbc:postgresql://host.docker.internal:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

rocketmq:
  # 改成你的外部 RocketMQ NameServer 地址
  namesrv-addr: 192.168.1.101:9876
  producer-group: debezium-cdc-producer
  topic: cdc-events2
  send-msg-timeout: 3000
  retry-times-when-send-failed: 2
  max-message-size: 4194304

async:
  event:
    queue:
      size: 10000
    sender:
      threads: 4
      batch:
        size: 100
        timeout:
          ms: 5000
    retry:
      enabled: true
      interval:
        seconds: 60

logging:
  level:
    root: INFO
    com.example.cdc: DEBUG
    io.debezium: INFO
    org.apache.rocketmq: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
