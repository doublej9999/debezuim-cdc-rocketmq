server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: debezium-cdc-rocketmq
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?sslmode=disable
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: "*"


# RocketMQ 配置
rocketmq:
  namesrv-addr: 45.128.210.102:9876
  producer-group: debezium-cdc-producer
  topic: cdc-events2
  send-msg-timeout: 3000
  retry-times-when-send-failed: 2
  max-message-size: 4194304
  orderly-enabled: true

# 异步事件发送配置
async:
  event:
    queue:
      size: 10000  # 事件队列大小
    sender:
      threads: 4  # 发送线程数
      batch:
        enabled: false  # 启用批量发送（有序发送时需关闭）
        size: 100  # 批处理大小
        timeout:
          ms: 5000  # 批处理超时（毫秒）
    retry:
      enabled: true  # 启用重试机制
      interval:
        seconds: 60  # 重试间隔（秒）

# CDC 全局配置
cdc:
  watchdog:
    interval:
      ms: 60000  # 看门狗巡检间隔
  heartbeat:
    interval:
      ms: 5000
    action:
      query: "SELECT 1"
  wal:
    warning:
      threshold-bytes: 1073741824  # WAL 堆积告警阈值 (1GB)

# 事件日志清理配置
event:
  cleanup:
    days: 3  # 保留天数（从 30 天缩短到 3 天以减少表膨胀）

# 全量快照配置
snapshot:
  schedule:
    enabled: true                 # 是否启用定时快照（false 则只允许手动触发）
    cron: "0 0 3 * * ?"           # 默认每天凌晨 3 点执行，可按需修改
  topic-suffix: "_ALL"            # 全量快照推送的 Topic 后缀（增量保持原 Topic 不变）
  batch:
    size: 500                     # 每批推送行数（同时作为 JDBC fetchSize）
    pause-ms: 50                  # 批次间暂停毫秒，避免打垮 RocketMQ Broker

# WAL 优化配置
wal:
  optimization:
    unlogged-event-log: true    # 将 event_log 设为 UNLOGGED TABLE（消除 WAL 写入放大）
    cleanup-inactive-slots: true # 启动时自动清理不活跃的 Replication Slot


# 日志配置
logging:
  level:
    root: INFO
    com.example.cdc: DEBUG
    io.debezium: INFO
    org.apache.rocketmq: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
