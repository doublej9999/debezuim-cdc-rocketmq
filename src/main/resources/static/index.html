<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debezium CDC 澶氱閬撶鐞嗗钩鍙?/title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header-info {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .pipeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .pipeline-card {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .pipeline-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .pipeline-card.running {
            border-color: #28a745;
            background: #f0f8f5;
        }

        .pipeline-card.stopped {
            border-color: #dc3545;
            background: #fdf5f5;
        }

        .pipeline-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .pipeline-name {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .pipeline-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .pipeline-status.running {
            background: #d4edda;
            color: #155724;
        }

        .pipeline-status.stopped {
            background: #f8d7da;
            color: #721c24;
        }

        .pipeline-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .pipeline-info-label {
            font-weight: 500;
            color: #333;
        }

        .pipeline-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 11px;
            flex: 1;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            color: #666;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
            background: white;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-bottom: 2px solid #dee2e6;
        }

        .tab-button {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .tab-button:hover {
            color: #667eea;
            background: #f8f9fa;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: #f8f9fa;
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .tab-content.active {
            display: block;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
            font-size: 13px;
        }

        input::placeholder {
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 澶撮儴 -->
    <header>
        <h1>馃殌 Debezium CDC 澶氱閬撶鐞嗗钩鍙?/h1>
        <div class="header-info">
            <div class="info-item">
                <span>娲昏穬绠￠亾鏁?</span>
                <span id="activePipelineCount" style="font-weight: bold;">-</span>
            </div>
            <div class="info-item">
                <span>鎬讳簨浠舵暟:</span>
                <span id="totalEvents" style="font-weight: bold;">-</span>
            </div>
            <div class="info-item">
                <button class="btn-primary" onclick="refreshAllStatus()">馃攧 鍒锋柊鎵€鏈夌姸鎬?/button>
            </div>
        </div>
    </header>

    <!-- 鏍囩椤?-->
    <div class="tabs">
        <button class="tab-button active" data-tab="pipelines" onclick="switchTab('pipelines', this)">馃搳 CDC 绠￠亾鐩戞帶</button>
        <button class="tab-button" data-tab="configs" onclick="switchTab('configs', this)">鈿欙笍 閰嶇疆绠＄悊</button>
        <button class="tab-button" data-tab="eventlogs" onclick="switchTab('eventlogs', this)">馃搵 浜嬩欢鏃ュ織</button>
    </div>

    <!-- CDC 绠￠亾鐩戞帶鏍囩椤?-->
    <div id="pipelines" class="tab-content active">
        <div class="card">
            <h2>馃搳 瀹炴椂 CDC 绠￠亾鐘舵€?/h2>
            <div id="pipelineAlert"></div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">娲昏穬绠￠亾</div>
                    <div class="stat-value" id="statActivePipelines">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">鎬讳簨浠舵暟</div>
                    <div class="stat-value" id="statTotalEvents">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">鏈€鍚庢洿鏂?/div>
                    <div class="stat-value" id="statLastUpdate" style="font-size: 14px;">-</div>
                </div>
            </div>

            <div id="pipelineContainer" class="pipeline-grid">
                <div class="empty-state">鏆傛棤 CDC 绠￠亾锛岃娣诲姞閰嶇疆骞跺惎鐢?/div>
            </div>
        </div>

        <!-- 寮傛鍙戦€佺粺璁￠潰鏉?-->
        <div class="card">
            <h2>馃摛 寮傛浜嬩欢鍙戦€佺粺璁?/h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">鎬诲叆闃熶簨浠?/div>
                    <div class="stat-value" id="statTotalEnqueued">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">鎴愬姛鍙戦€?/div>
                    <div class="stat-value" id="statTotalSent" style="color: #28a745;">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">鍙戦€佸け璐?/div>
                    <div class="stat-value" id="statTotalFailed" style="color: #dc3545;">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">闃熷垪涓緟鍙戦€?/div>
                    <div class="stat-value" id="statQueuedSize" style="color: #ffc107;">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">鏈嶅姟鐘舵€?/div>
                    <div class="stat-value" id="statAsyncRunning" style="font-size: 14px;">-</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 閰嶇疆绠＄悊鏍囩椤?-->
    <div id="configs" class="tab-content">
        <div class="card">
            <h2>馃摑 鏂板鏁版嵁婧愰厤缃?/h2>
            <div id="formAlert"></div>
            <form id="configForm">
                <input type="hidden" id="editConfigId">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                    <div>
                        <label>閰嶇疆鍚嶇О *</label>
                        <input type="text" id="configName" placeholder="渚嬪: 鐢熶骇搴撶敤鎴疯〃" required>
                    </div>
                    <div>
                        <label>鏁版嵁搴撲富鏈?*</label>
                        <input type="text" id="dbHostname" placeholder="localhost" required>
                    </div>
                    <div>
                        <label>鏁版嵁搴撶鍙?*</label>
                        <input type="number" id="dbPort" placeholder="5432" value="5432" required>
                    </div>
                    <div>
                        <label>鏁版嵁搴撳悕 *</label>
                        <input type="text" id="dbName" placeholder="postgres" required>
                    </div>
                    <div>
                        <label>鏁版嵁搴撶敤鎴?*</label>
                        <input type="text" id="dbUser" placeholder="postgres" required>
                    </div>
                    <div>
                        <label>鏁版嵁搴撳瘑鐮?*</label>
                        <input type="password" id="dbPassword" placeholder="杈撳叆瀵嗙爜" required>
                    </div>
                    <div>
                        <label>Schema 鍚嶇О *</label>
                        <input type="text" id="schemaName" placeholder="public" required>
                    </div>
                    <div>
                        <label>琛ㄥ悕 *</label>
                        <input type="text" id="tableName" placeholder="users" required>
                    </div>
                    <div>
                        <label>RocketMQ Topic *</label>
                        <input type="text" id="rocketmqTopic" placeholder="cdc-events" required>
                    </div>
                    <div>
                        <label>RocketMQ Tag</label>
                        <input type="text" id="rocketmqTag" placeholder="鍙€夛紝濡? users">
                    </div>
                    <div>
                        <label>RocketMQ NameServer</label>
                        <input type="text" id="rocketmqNamesrvAddr" placeholder="可选，默认使用全局配置，如 localhost:9876">
                    </div>
                    <div>
                        <label>RocketMQ Producer Group</label>
                        <input type="text" id="rocketmqProducerGroup" placeholder="可选，默认使用全局配置，如 debezium-cdc-producer">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" id="submitBtn" class="btn-primary" style="flex: 1; padding: 12px;">💾 保存配置</button>
                    <button type="button" id="cancelEditBtn" class="btn-warning" style="flex: 1; padding: 12px; display: none;" onclick="cancelEditConfig()">取消编辑</button>
                    <button type="reset" class="btn-warning" style="flex: 1; padding: 12px;" onclick="clearConfigFormState()">🔄 重置</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>馃搵 宸蹭繚瀛樼殑閰嶇疆</h2>
            <div id="listAlert"></div>
            <div class="table-container">
                <table id="configTable">
                    <thead>
                    <tr>
                        <th>閰嶇疆鍚嶇О</th>
                        <th>鏁版嵁搴?/th>
                        <th>Schema.琛?/th>
                        <th>Topic / Tag</th>
                        <th>鐘舵€?/th>
                        <th>鎿嶄綔</th>
                    </tr>
                    </thead>
                    <tbody id="configTableBody">
                    <tr>
                        <td colspan="6" class="empty-state">鏆傛棤閰嶇疆锛岃娣诲姞鏂伴厤缃?/td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 浜嬩欢鏃ュ織鏍囩椤?-->
    <div id="eventlogs" class="tab-content">
        <div class="card">
            <h2>馃搳 浜嬩欢缁熻</h2>
            <div id="eventStatsContainer"
                 style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                <div class="stat-card">
                    <div class="stat-label">寰呭彂閫?/div>
                    <div class="stat-value" id="statPending">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">宸插彂閫?/div>
                    <div class="stat-value" id="statSent" style="color: #28a745;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">澶辫触</div>
                    <div class="stat-value" id="statFailed" style="color: #dc3545;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">閲嶈瘯涓?/div>
                    <div class="stat-value" id="statRetry" style="color: #ffc107;">0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0;">馃搵 浜嬩欢鏃ュ織鍒楄〃</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="searchKeyword" placeholder="鎼滅储 Topic/Tag/閰嶇疆鍚嶇О"
                           style="padding: 8px; border-radius: 4px; border: 1px solid #ddd; width: 200px; height: 50px; ">
                    <select id="statusFilter"
                            style="padding: 8px; border-radius: 4px; border: 1px solid #ddd; height: 50px;">
                        <option value="">鍏ㄩ儴鐘舵€?/option>
                        <option value="PENDING">寰呭彂閫?/option>
                        <option value="SENT">宸插彂閫?/option>
                        <option value="FAILED">澶辫触</option>
                        <option value="RETRY">閲嶈瘯涓?/option>
                    </select>
                    <button class="btn-primary btn-small"
                            style="width: auto; min-width: 60px; padding: 0 16px; white-space: nowrap;height: 50px;font-weight: bold;"
                            onclick="refreshEventLogs()">鍒锋柊
                    </button>

                    <button class="btn-warning btn-small"
                            style="width: auto; min-width: 80px; padding: 0 16px; white-space: nowrap;height: 50px;font-weight: bold;"
                            onclick="retryFailedEvents()">鎵嬪姩閲嶈瘯
                    </button>
                </div>
            </div>
            <div id="eventLogAlert"></div>
            <div class="table-container">
                <table id="eventLogTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>閰嶇疆鍚嶇О</th>
                        <th>Topic</th>
                        <th>Tag</th>
                        <th>娑堟伅Key</th>
                        <th>鐘舵€?/th>
                        <th>閲嶈瘯娆℃暟</th>
                        <th>鍒涘缓鏃堕棿</th>
                        <th>閿欒淇℃伅</th>
                    </tr>
                    </thead>
                    <tbody id="eventLogTableBody">
                    <tr>
                        <td colspan="9" class="empty-state">鍔犺浇涓?..</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px;">
                <button class="btn-secondary btn-small" onclick="previousPage()" id="prevBtn">涓婁竴椤?/button>
                <span id="pageInfo" style="padding: 8px;">绗?1 椤?/span>
                <button class="btn-secondary btn-small" onclick="nextPage()" id="nextBtn">涓嬩竴椤?/button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api';
    const DATASOURCE_API = '/api/datasource';
    const PIPELINE_API = '/api/pipeline';
    let editingConfigId = null;
    let editingConfigActive = false;

    document.addEventListener('DOMContentLoaded', () => {
        loadConfigs();
        refreshAllStatus();
        bindEventLogFilters();
        setInterval(refreshAllStatus, 5000);
    });

    document.getElementById('configForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const config = collectConfigFromForm();
        const isEditMode = editingConfigId !== null;
        const requestUrl = isEditMode ? `${DATASOURCE_API}/${editingConfigId}` : DATASOURCE_API;
        const requestMethod = isEditMode ? 'PUT' : 'POST';

        try {
            const response = await fetch(requestUrl, {
                method: requestMethod,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(config)
            });

            if (response.ok) {
                showAlert('formAlert', isEditMode ? '✅ 配置更新成功' : '✅ 配置保存成功', 'success');
                clearConfigFormState();
                loadConfigs();
                setTimeout(refreshAllStatus, 1000);
            } else {
                showAlert('formAlert', isEditMode ? '❌ 配置更新失败，请检查输入' : '❌ 配置保存失败，请检查输入', 'error');
            }
        } catch (error) {
            showAlert('formAlert', '❌ 网络错误: ' + error.message, 'error');
        }
    });

    function collectConfigFromForm() {
        return {
            name: document.getElementById('configName').value,
            dbHostname: document.getElementById('dbHostname').value,
            dbPort: parseInt(document.getElementById('dbPort').value, 10),
            dbName: document.getElementById('dbName').value,
            dbUser: document.getElementById('dbUser').value,
            dbPassword: document.getElementById('dbPassword').value,
            schemaName: document.getElementById('schemaName').value,
            tableName: document.getElementById('tableName').value,
            rocketmqTopic: document.getElementById('rocketmqTopic').value,
            rocketmqTag: document.getElementById('rocketmqTag').value,
            rocketmqNamesrvAddr: document.getElementById('rocketmqNamesrvAddr').value,
            rocketmqProducerGroup: document.getElementById('rocketmqProducerGroup').value,
            isActive: editingConfigId !== null ? editingConfigActive : false
        };
    }

    function fillConfigFormForEdit(config) {
        editingConfigId = config.id;
        editingConfigActive = !!config.isActive;
        document.getElementById('editConfigId').value = config.id;
        document.getElementById('configName').value = config.name || '';
        document.getElementById('dbHostname').value = config.dbHostname || '';
        document.getElementById('dbPort').value = config.dbPort || 5432;
        document.getElementById('dbName').value = config.dbName || '';
        document.getElementById('dbUser').value = config.dbUser || '';
        document.getElementById('dbPassword').value = '';
        document.getElementById('schemaName').value = config.schemaName || '';
        document.getElementById('tableName').value = config.tableName || '';
        document.getElementById('rocketmqTopic').value = config.rocketmqTopic || '';
        document.getElementById('rocketmqTag').value = config.rocketmqTag || '';
        document.getElementById('rocketmqNamesrvAddr').value = config.rocketmqNamesrvAddr || '';
        document.getElementById('rocketmqProducerGroup').value = config.rocketmqProducerGroup || '';

        document.getElementById('submitBtn').textContent = '💾 保存编辑';
        document.getElementById('cancelEditBtn').style.display = 'inline-block';
        switchTab('configs');
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function clearConfigFormState() {
        editingConfigId = null;
        editingConfigActive = false;
        document.getElementById('editConfigId').value = '';
        document.getElementById('configForm').reset();
        document.getElementById('dbPort').value = 5432;
        document.getElementById('submitBtn').textContent = '💾 保存配置';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function cancelEditConfig() {
        clearConfigFormState();
        showAlert('formAlert', '已取消编辑', 'success');
    }

    async function loadConfigs() {
        try {
            const response = await fetch(DATASOURCE_API);
            const configs = await response.json();

            const tbody = document.getElementById('configTableBody');
            if (configs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">暂无配置，请添加新配置</td></tr>';
                return;
            }

            tbody.innerHTML = configs.map(config => `
                    <tr>
                        <td><strong>${config.name}</strong></td>
                        <td>${config.dbHostname}:${config.dbPort}/${config.dbName}</td>
                        <td>${config.schemaName}.${config.tableName}</td>
                        <td>${config.rocketmqTopic}${config.rocketmqTag ? ' / ' + config.rocketmqTag : ''}</td>
                        <td>
                            <span class="status-badge ${config.isActive ? 'status-running' : 'status-stopped'}">
                                ${config.isActive ? '✅ 启用' : '⭕ 停用'}
                            </span>
                        </td>
                        <td>
                            <div style="display: flex; gap: 8px;">
                                <button class="btn-primary btn-small" onclick='fillConfigFormForEdit(${JSON.stringify(config)})'>✏️ 编辑</button>
                                <button class="btn-success btn-small" onclick="toggleConfig(${config.id})">
                                    ${config.isActive ? '⏸ 停用' : '▶ 启用'}
                                </button>
                                <button class="btn-danger btn-small" onclick="deleteConfig(${config.id})">🗑 删除</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
        } catch (error) {
            showAlert('listAlert', '❌ 加载配置失败: ' + error.message, 'error');
        }
    }

    async function toggleConfig(id) {
        try {
            const response = await fetch(`${DATASOURCE_API}/${id}/toggle`, {
                method: 'POST'
            });

            if (response.ok) {
                showAlert('listAlert', '✅ 状态已更新', 'success');
                loadConfigs();
                setTimeout(refreshAllStatus, 1000);
            } else {
                showAlert('listAlert', '❌ 更新失败', 'error');
            }
        } catch (error) {
            showAlert('listAlert', '❌ 网络错误: ' + error.message, 'error');
        }
    }

    async function deleteConfig(id) {
        if (!confirm('确定要删除这个配置吗？')) return;

        try {
            const response = await fetch(`${DATASOURCE_API}/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showAlert('listAlert', '✅ 配置已删除', 'success');
                if (editingConfigId === id) {
                    clearConfigFormState();
                }
                loadConfigs();
                setTimeout(refreshAllStatus, 1000);
            } else {
                showAlert('listAlert', '❌ 删除失败', 'error');
            }
        } catch (error) {
            showAlert('listAlert', '❌ 网络错误: ' + error.message, 'error');
        }
    }

    async function refreshAllStatus() {
        try {
            const response = await fetch(`${PIPELINE_API}/status`);
            const pipelines = await response.json();

            const container = document.getElementById('pipelineContainer');
            let totalEvents = 0;

            if (Object.keys(pipelines).length === 0) {
                container.innerHTML = '<div class="empty-state">鏆傛棤娲昏穬 CDC 绠￠亾</div>';
                document.getElementById('statActivePipelines').textContent = '0';
                document.getElementById('statTotalEvents').textContent = '0';
            } else {
                const cards = Object.values(pipelines).map(pipeline => {
                    totalEvents += pipeline.processedEvents;
                    return `
                            <div class="pipeline-card ${pipeline.running ? 'running' : 'stopped'}">
                                <div class="pipeline-header">
                                    <div class="pipeline-name">${pipeline.configName}</div>
                                    <div class="pipeline-status ${pipeline.running ? 'running' : 'stopped'}">
                                        ${pipeline.running ? '鉁?杩愯涓? : '鈼?宸插仠姝?}
                                    </div>
                                </div>
                                <div class="pipeline-info">
                                    <div><span class="pipeline-info-label">鏁版嵁搴?</span> ${pipeline.dbHostname}</div>
                                    <div><span class="pipeline-info-label">琛?</span> ${pipeline.schemaName}.${pipeline.tableName}</div>
                                    <div><span class="pipeline-info-label">Topic:</span> ${pipeline.rocketmqTopic}</div>
                                    <div><span class="pipeline-info-label">浜嬩欢鏁?</span> ${pipeline.processedEvents}</div>
                                    <div><span class="pipeline-info-label">LSN:</span> ${pipeline.currentLsn}</div>
                                </div>
                                <div class="pipeline-actions">
                                    <button class="btn-success btn-small" onclick="restartPipeline(${pipeline.configId})">馃攧 閲嶅惎</button>
                                    <button class="btn-danger btn-small" onclick="stopPipeline(${pipeline.configId})">鈴?鍋滄</button>
                                </div>
                            </div>
                        `;
                }).join('');

                container.innerHTML = cards;
                document.getElementById('statActivePipelines').textContent = Object.keys(pipelines).length;
                document.getElementById('statTotalEvents').textContent = totalEvents;
            }

            document.getElementById('activePipelineCount').textContent = Object.keys(pipelines).length;
            document.getElementById('totalEvents').textContent = totalEvents;
            document.getElementById('statLastUpdate').textContent = new Date().toLocaleTimeString('zh-CN');

            // 鍒锋柊寮傛鍙戦€佺粺璁?            await refreshAsyncStats();

        } catch (error) {
            console.error('鍒锋柊绠￠亾鐘舵€佸け璐?', error);
        }
    }

    // 鍒锋柊寮傛鍙戦€佺粺璁?    async function refreshAsyncStats() {
        try {
            const response = await fetch(`${PIPELINE_API}/async-stats`);
            const stats = await response.json();

            document.getElementById('statTotalEnqueued').textContent = stats.totalEnqueued;
            document.getElementById('statTotalSent').textContent = stats.totalSent;
            document.getElementById('statTotalFailed').textContent = stats.totalFailed;
            document.getElementById('statQueuedSize').textContent = stats.queuedSize;
            document.getElementById('statAsyncRunning').textContent = stats.running ? '鉁?杩愯涓? : '鈼?宸插仠姝?;

        } catch (error) {
            console.error('鍒锋柊寮傛缁熻澶辫触:', error);
        }
    }

    // 鍋滄 CDC 绠￠亾
    async function stopPipeline(configId) {
        try {
            const response = await fetch(`${PIPELINE_API}/${configId}/stop`, {
                method: 'POST'
            });

            if (response.ok) {
                showAlert('pipelineAlert', '鉁?CDC 绠￠亾宸插仠姝?, 'success');
                setTimeout(refreshAllStatus, 500);
            } else {
                showAlert('pipelineAlert', '鉂?鍋滄澶辫触', 'error');
            }
        } catch (error) {
            showAlert('pipelineAlert', '鉂?缃戠粶閿欒: ' + error.message, 'error');
        }
    }

    // 閲嶅惎 CDC 绠￠亾
    async function restartPipeline(configId) {
        try {
            const response = await fetch(`${PIPELINE_API}/${configId}/restart`, {
                method: 'POST'
            });

            if (response.ok) {
                showAlert('pipelineAlert', '鉁?CDC 绠￠亾宸查噸鍚?, 'success');
                setTimeout(refreshAllStatus, 500);
            } else {
                showAlert('pipelineAlert', '鉂?閲嶅惎澶辫触', 'error');
            }
        } catch (error) {
            showAlert('pipelineAlert', '鉂?缃戠粶閿欒: ' + error.message, 'error');
        }
    }

    // 鍒囨崲鏍囩椤?    function switchTab(tabName, tabButton) {
        // 闅愯棌鎵€鏈夋爣绛鹃〉
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });

        // 绉婚櫎鎵€鏈夋寜閽殑娲昏穬鐘舵€?        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.classList.remove('active');
        });

        // 鏄剧ず閫変腑鐨勬爣绛鹃〉
        document.getElementById(tabName).classList.add('active');

        // 鏍囪閫変腑鐨勬寜閽?        const targetButton = tabButton || document.querySelector(`.tab-button[data-tab="${tabName}"]`);
        if (targetButton) {
            targetButton.classList.add('active');
        }
    }

    // 鏄剧ず鎻愮ず淇℃伅
    function showAlert(elementId, message, type) {
        const alert = document.getElementById(elementId);
        alert.textContent = message;
        alert.className = `alert alert-${type}`;
        setTimeout(() => {
            alert.className = 'alert';
        }, 5000);
    }

    // ========== 浜嬩欢鏃ュ織鐩稿叧鍑芥暟 ==========
    const EVENT_LOG_API = '/api/event-log';
    let currentPage = 0;
    let currentStatus = '';

    // 鍒囨崲鏍囩椤垫椂鍔犺浇浜嬩欢鏃ュ織
    const originalSwitchTab = switchTab;
    switchTab = function (tabName, tabButton) {
        originalSwitchTab.call(this, tabName, tabButton);
        if (tabName === 'eventlogs') {
            refreshEventLogs();
            refreshEventStats();
        }
    };

    // 鍒锋柊浜嬩欢缁熻
    async function refreshEventStats() {
        try {
            const response = await fetch(`${EVENT_LOG_API}/statistics`);
            if (response.ok) {
                const stats = await response.json();
                document.getElementById('statPending').textContent = stats.PENDING || 0;
                document.getElementById('statSent').textContent = stats.SENT || 0;
                document.getElementById('statFailed').textContent = stats.FAILED || 0;
                document.getElementById('statRetry').textContent = stats.RETRY || 0;
            }
        } catch (error) {
            console.error('鑾峰彇浜嬩欢缁熻澶辫触:', error);
        }
    }

    // 鍒锋柊浜嬩欢鏃ュ織鍒楄〃
    async function refreshEventLogs() {
        try {
            const keyword = document.getElementById('searchKeyword').value.trim();
            const status = document.getElementById('statusFilter').value;

            let url;
            if (keyword || status) {
                // 浣跨敤鎼滅储 API
                const params = new URLSearchParams();
                params.append('page', currentPage);
                params.append('size', 20);
                if (keyword) params.append('keyword', keyword);
                if (status) params.append('status', status);
                url = `${EVENT_LOG_API}/search?${params.toString()}`;
            } else {
                // 浣跨敤榛樿鏌ヨ API
                url = `${EVENT_LOG_API}?page=${currentPage}&size=20`;
            }

            const response = await fetch(url);
            if (response.ok) {
                const data = await response.json();
                renderEventLogs(data);
            } else {
                showAlert('eventLogAlert', '鉂?鍔犺浇浜嬩欢鏃ュ織澶辫触', 'error');
            }
        } catch (error) {
            showAlert('eventLogAlert', '鉂?缃戠粶閿欒: ' + error.message, 'error');
        }
    }

    // 娓叉煋浜嬩欢鏃ュ織琛ㄦ牸
    function renderEventLogs(data) {
        const tbody = document.getElementById('eventLogTableBody');

        if (!data.content || data.content.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty-state">鏆傛棤浜嬩欢鏃ュ織</td></tr>';
            return;
        }

        const rows = data.content.map(log => {
            const statusClass = {
                'PENDING': 'status-badge',
                'SENT': 'status-badge status-running',
                'FAILED': 'status-badge status-stopped',
                'RETRY': 'status-badge'
            }[log.status] || 'status-badge';

            const statusStyle = {
                'PENDING': 'background: #ffc107; color: #856404;',
                'SENT': '',
                'FAILED': '',
                'RETRY': 'background: #17a2b8; color: #fff;'
            }[log.status] || '';

            return `
                    <tr>
                        <td>${log.id}</td>
                        <td>${log.configName}</td>
                        <td>${log.topic}</td>
                        <td>${log.tag || '-'}</td>
                        <td>${log.messageKey || '-'}</td>
                        <td><span class="${statusClass}" style="${statusStyle}">${log.status}</span></td>
                        <td>${log.retryCount}/${log.maxRetry}</td>
                        <td>${formatDateTime(log.createdAt)}</td>
                        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                            title="${log.errorMessage || '-'}">${log.errorMessage || '-'}</td>
                    </tr>
                `;
        }).join('');

        tbody.innerHTML = rows;

        // 鏇存柊鍒嗛〉淇℃伅
        document.getElementById('pageInfo').textContent = `绗?${data.number + 1} 椤?/ 鍏?${data.totalPages} 椤礰;
        document.getElementById('prevBtn').disabled = data.first;
        document.getElementById('nextBtn').disabled = data.last;
    }

    // 鏍煎紡鍖栨棩鏈熸椂闂?    function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return '-';
        const date = new Date(dateTimeStr);
        return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    // 涓婁竴椤?    function previousPage() {
        if (currentPage > 0) {
            currentPage--;
            refreshEventLogs();
        }
    }

    // 涓嬩竴椤?    function nextPage() {
        currentPage++;
        refreshEventLogs();
    }

    // 鎵嬪姩瑙﹀彂閲嶈瘯
    async function retryFailedEvents() {
        try {
            const response = await fetch(`${EVENT_LOG_API}/retry`, {method: 'POST'});
            if (response.ok) {
                const message = await response.text();
                showAlert('eventLogAlert', '鉁?' + message, 'success');
                setTimeout(() => {
                    refreshEventLogs();
                    refreshEventStats();
                }, 1000);
            } else {
                showAlert('eventLogAlert', '鉂?閲嶈瘯澶辫触', 'error');
            }
        } catch (error) {
            showAlert('eventLogAlert', '鉂?缃戠粶閿欒: ' + error.message, 'error');
        }
    }

    // 缁戝畾浜嬩欢鏃ュ織绛涢€変笌鎼滅储浜嬩欢
    function bindEventLogFilters() {
        const statusFilter = document.getElementById('statusFilter');
        const searchKeyword = document.getElementById('searchKeyword');

        if (statusFilter) {
            statusFilter.addEventListener('change', () => {
                currentPage = 0;
                refreshEventLogs();
            });
        }

        if (searchKeyword) {
            // 鍥炶溅閿悳绱?            searchKeyword.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    currentPage = 0;
                    refreshEventLogs();
                }
            });
        }
    }
</script>
</body>
